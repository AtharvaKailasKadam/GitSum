name: GitSum CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'GitSum/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd GitSum
          npm ci

      - name: Run Frontend Lint
        run: |
          cd GitSum
          npm run lint

      - name: Run Frontend Tests
        run: |
          cd GitSum
          npm run test

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Run Backend Tests
        run: |
          cd server
          npm run test
